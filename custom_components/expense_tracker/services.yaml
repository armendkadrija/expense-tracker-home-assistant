add_expense:
  name: Add expense
  description: Log a new expense.
  fields:
    amount:
      required: true
      selector:
        number:
          min: 0
          mode: box
    type:
      required: true
      selector:
        text:
    user:
      required: false
      description: >
        Who this belongs to. Defaults to whoever is linked to the calling
        Home Assistant account; only needed to log on someone else's
        behalf.
      selector:
        entity:
          domain: person
    date:
      required: false
      selector:
        date:
    receipt:
      required: false
      selector:
        file:
          accept: "image/*"
    note:
      required: false
      selector:
        text:

add_type:
  name: Add expense type
  description: Register a new expense type.
  fields:
    name:
      required: true
      selector:
        text:
    icon:
      required: true
      selector:
        icon:

remove_type:
  name: Remove expense type
  description: >
    Remove an expense type. Refused if any expense still uses it -- remove
    or re-type those expenses first.
  fields:
    name:
      required: true
      selector:
        text:

remove_expense:
  name: Remove expense
  description: Delete an expense and its receipt file, if any.
  fields:
    id:
      required: true
      selector:
        text:

list_expenses:
  name: List expenses
  description: >
    Read-only: returns individual expense records (id, amount, type,
    icon, date, note, receipt path), most recent first.
  fields:
    limit:
      required: false
      description: Max number of expenses to return. Omit for all.
      selector:
        number:
          min: 1
          mode: box
    offset:
      required: false
      description: Number of expenses to skip (for pagination).
      selector:
        number:
          min: 0
          mode: box

list_types:
  name: List expense types
  description: >
    Read-only: returns every expense type (name, icon, and how many
    expenses currently use it) -- a type with a nonzero count cannot be
    removed. Returned in display order.

reorder_types:
  name: Reorder expense types
  description: >
    Set the display order of expense types. `names` must list every
    existing type exactly once, in the desired order -- refused otherwise.
  fields:
    names:
      required: true
      example: '["Groceries", "Transport", "Other"]'
      selector:
        object:
