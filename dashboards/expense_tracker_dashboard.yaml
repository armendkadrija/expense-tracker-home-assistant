# The Expense Tracker dashboard: 4 tabs (Add / All Expenses / Stats / Types).
#
# The integration auto-registers its dashboard resources, but cannot
# create the dashboard itself (verified against source -- see
# lovelace_setup.py). Paste this into a new dashboard's raw YAML editor.
# See README.md's "Dashboard setup" section for the one-time steps.
title: Expenses
icon: mdi:cash-multiple
views:
  - type: sections
    title: Add
    path: add
    icon: mdi:plus-circle
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: custom:expense-tracker-add-card
          - type: custom:expense-tracker-list-card
            title: Recent expenses
            limit: 5
            show_more_path: /expense-tracker/all

  - type: sections
    title: All Expenses
    path: all
    icon: mdi:format-list-bulleted
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: custom:expense-tracker-list-card
            title: All expenses

  - type: sections
    title: Stats
    path: stats
    icon: mdi:chart-donut
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: tile
            entity: sensor.expense_tracker_total
            name: All-time total
            tap_action: { action: more-info }
            grid_options: { columns: 6, rows: 1 }
          - type: tile
            entity: sensor.expense_tracker_total_this_month
            name: This month
            tap_action: { action: more-info }
            grid_options: { columns: 6, rows: 1 }
          - type: markdown
            title: By type
            content: >-
              {% set data = state_attr('sensor.expense_tracker_total',
              'by_type') or {} %}{% set unit =
              state_attr('sensor.expense_tracker_total',
              'unit_of_measurement') %}{% if data %}{% for name, amount in
              data.items() | sort(attribute='1', reverse=true) %}-
              **{{ name }}**: {{ '%.2f' | format(amount) }} {{ unit }}
              {% endfor %}{% else %}No expenses yet.{% endif %}
          - type: markdown
            title: By person
            content: >-
              {% set data = state_attr('sensor.expense_tracker_total',
              'by_user') or {} %}{% set unit =
              state_attr('sensor.expense_tracker_total',
              'unit_of_measurement') %}{% if data %}{% for uid, amount in
              data.items() | sort(attribute='1', reverse=true) %}-
              **{{ states[uid].name if uid in states else uid }}**:
              {{ '%.2f' | format(amount) }} {{ unit }}
              {% endfor %}{% else %}No expenses yet.{% endif %}

  - type: sections
    title: Types
    path: types
    icon: mdi:shape
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: custom:expense-tracker-types-card
